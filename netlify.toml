[build]
  # bun install без --frozen-lockfile, чтобы lockfile перегенерировался
  # после правок package.json (иначе CI падает на "lockfile is frozen").
  command = "bun install --no-frozen-lockfile && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — иначе прямые URL (/live/ABC, /admin и т.д.) дают 404 при F5
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.telegram.org https://connector-gateway.lovable.dev; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
