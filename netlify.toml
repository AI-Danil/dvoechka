[build]
  # Удаляем lock перед install: в репо залочен musl-вариант @swc/core
  # (Lovable-песочница на Alpine), а Netlify собирает на glibc → EBADPLATFORM.
  # Пересборка lock даёт npm подобрать правильные glibc-биндинги.
  command = "rm -f package-lock.json && npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — иначе прямые URL (/live/ABC, /admin и т.д.) дают 404 при F5
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
