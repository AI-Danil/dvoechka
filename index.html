  <body style="margin:0;background:#f4f7f6">
    <!-- Diagnostic beacon: hits server BEFORE any JS runs. If we don't get this hit in TG, HTML never reached the kid. -->
    <img
      src="https://gbpqlzjtcuhijtouwrvn.supabase.co/functions/v1/page-beacon?stage=html"
      width="1" height="1" alt="" aria-hidden="true"
      style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">

    <div id="root">
      <div data-loading-fallback style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,Arial,sans-serif;color:#0f1f17;background:#f4f7f6;padding:20px">
        <div style="text-align:center;background:#ffffff;border:2px solid #167a4a;border-radius:12px;padding:24px 28px;max-width:480px;box-shadow:0 4px 16px rgba(0,0,0,.08)">
          <div style="font-size:2.4rem;margin-bottom:8px">📚</div>
          <div style="font-size:20px;font-weight:700;color:#0f1f17">Загружаем тест…</div>
          <div style="font-size:13px;margin-top:12px;color:#3a4a40">Если страница не открывается дольше 10 секунд — обновите её (Ctrl+R или потяните вниз).</div>
        </div>
      </div>
    </div>
    <noscript>
      <div style="padding:20px;text-align:center;font-family:system-ui,-apple-system,Arial,sans-serif;color:#0f1f17">
        Для теста нужен включённый JavaScript. Откройте страницу в Chrome или Edge и включите JavaScript.
      </div>
    </noscript>
    <script>
      // SPA fallback for GitHub Pages: 404.html redirects /foo/bar → /?/foo/bar,
      // here we restore the original path into history before React Router boots.
      (function () {
        var l = window.location;
        if (l.search && l.search.indexOf("?/") === 0) {
          var decoded = l.search.slice(2).split("&")[0].replace(/~and~/g, "&");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + "/" + decoded + l.hash);
        }
      })();
    </script>
    <script>
      // ES5 only! No const/let/arrow — must run on very old school browsers.
      (function () {
        try {
          // Beacon: HTML reached, inline JS executed.
          var i = new Image();
          i.src = "https://gbpqlzjtcuhijtouwrvn.supabase.co/functions/v1/page-beacon?stage=html-js&ua=" +
            encodeURIComponent((navigator.userAgent || "").substring(0, 160));
        } catch (e) { /* ignore */ }

        window.setTimeout(function () {
          var root = document.getElementById("root");
          if (!root || !root.querySelector("[data-loading-fallback]")) return;

          // Bundle never replaced #root → tell the server.
          try {
            var f = new Image();
            f.src = "https://gbpqlzjtcuhijtouwrvn.supabase.co/functions/v1/page-beacon?stage=js-timeout&ua=" +
              encodeURIComponent((navigator.userAgent || "").substring(0, 160));
          } catch (e2) { /* ignore */ }

          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,Arial,sans-serif;color:#0f1f17;background:#f4f7f6;padding:20px"><div style="max-width:520px;background:#fff;border:2px solid #c43d3d;border-radius:12px;padding:24px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.08)"><div style="font-size:40px;margin-bottom:8px">⚠️</div><h1 style="font-size:20px;margin:0 0 12px;color:#0f1f17">Страница не загрузилась</h1><p style="line-height:1.5;color:#3a4a40;margin:0 0 12px">Обновите страницу. Если не помогло — откройте <b>https://dvoechka.lovable.app/</b> в свежем Chrome или Edge, отключите переводчик/блокировщик и режим экономии трафика.</p><button onclick="location.reload()" style="background:#167a4a;color:white;border:0;border-radius:8px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer">Обновить</button><p style="font-size:12px;color:#6b7a72;margin-top:14px">Сообщите учителю: скрипт сайта не запустился.</p></div></div>';
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
